Lightning:
  optimizer_name: "torch.optim:Adam"
  optimizer_kwargs:
    lr: 0.001
  loss_fn:
    _target_: alchemist.losses:KLLoss
    pdb_path: examples/GaAs/GaAs216.pdb
    box: [17.25, 17.25, 17.25]
    cuts: [2.5, 4.5]
    MU: [0.0, 0.0]
    E1: [[-0.3, -0.5], [-0.5, -0.1]]
    E2: [[-0.05, 0.0], [0.0, -0.05]]
    KT: 0.5
    sigma_r: 1.0
    M: 1.0
    identity: argmax
Trainer:
  max_epochs: 100
  use_distributed_sampler: False
