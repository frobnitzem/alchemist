[project]
name = "alchemist-nn"
version = "0.2.0"
description = "Generative AI tools for molecules."
authors = [
    {name = "David M. Rogers", email = "predictivestatmech@gmail.com"}
]
license = {text = "BSD-3"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.26.2,<3.0.0",
    "qtorch>=0.3.0,<0.4.0",
    "dpdata>=0.2.25,<0.3.0",
    "typer>=0.9.0,<1.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "ruamel-yaml>=0.18.15,<0.19.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[project.scripts]
alchemist = "alchemist.alchemist:app"

[tool.setuptools.packages.find]
include = ["alchemist*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
